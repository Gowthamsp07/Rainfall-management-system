# pysteps development environment requirements
name: test_environment
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  - mamba
  # Minimal dependencies required
  - numpy
  - cython
  - jsmin
  - jsonschema
  - matplotlib
  - netCDF4
  - opencv
  - pillow
  - pyproj
  - scipy
  # Optional dependencies(for safe usage)
  - dask
  - pyfftw
  - cartopy
  - h5py
  - PyWavelets
  - pandas
  - scikit-image
  - rasterio
  - gdal
  # Test dependencies for the projct
  - pytest
  - pytest-cov
  - pip:
      - cookiecutter
